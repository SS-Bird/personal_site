<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sophie Bird's sewing archive: historical clothing, modern pieces, and mending." />
    <title>Sophie Bird — Sewing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!-- Order here doesn't matter for stacking; z-index in style.css does. -->
    <!-- The header lives UNDER the fabric and scrolls sideways beneath its edge.
         main.js copies .header-set a few times so the scrolling loops. -->
    <header class="site-header">
      <div class="header-set">
      <a class="brand" href="/" data-link aria-label="Sophie Bird home"><span class="brand-ink"></span></a>
      <nav aria-label="Main navigation">
        <a href="/sewing" data-link>Sewing</a>
        <a href="/projects" data-link>Projects</a>
        <a href="/resume" data-link>Resume</a>
      </nav>
      </div>
    </header>

    <canvas id="gl"></canvas>
    <!-- Patches sewn onto the left strip: the Sewing section's subpages.
         Filled in by patches.js; clipped from JS to the strip's visible cloth. -->
    <div id="patches"><nav class="patch-list" aria-label="Sewing"></nav></div>
    <main id="content"><div id="scroller"></div></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
